name: Build Telegram APK

on:
  push:
    branches:
      - master
      - main
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      build_variant:
        description: 'نوع خروجی (Build Variant)'
        required: true
        default: 'Standalone'
        type: choice
        options:
          - 'Standalone'
          - 'Release'
          - 'Debug'
          - 'All'

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Ensure Submodules are synced
        run: |
          git submodule sync --recursive
          git submodule update --init --recursive --depth 1

      - name: Expand Swap Space
        run: |
          sudo swapoff -a || true
          sudo rm -f /swapfile || true
          sudo fallocate -l 6G /mnt/swapfile || sudo dd if=/dev/zero of=/mnt/swapfile bs=1M count=6144
          sudo chmod 600 /mnt/swapfile
          sudo mkswap /mnt/swapfile
          sudo swapon /mnt/swapfile
          free -h

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Install Android SDK, NDK and CMake
        run: |
          sudo chown -R $USER:$USER $ANDROID_HOME
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "cmake;3.22.1" \
            "ndk;27.2.12479018"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> $GITHUB_ENV

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build APK
        env:
          BUILD_VARIANT: ${{ github.event.inputs.build_variant || 'Standalone' }}
        run: |
          GRADLE_ARGS="--stacktrace --info --no-daemon -Dorg.gradle.jvmargs=-Xmx4g"
          echo "Building variant: $BUILD_VARIANT"
          if [ "$BUILD_VARIANT" = "Standalone" ]; then
            ./gradlew :TMessagesProj_AppStandalone:assembleAfatStandalone $GRADLE_ARGS
          elif [ "$BUILD_VARIANT" = "Release" ]; then
            ./gradlew :TMessagesProj_App:assembleAfatRelease $GRADLE_ARGS
          elif [ "$BUILD_VARIANT" = "Debug" ]; then
            ./gradlew :TMessagesProj_App:assembleAfatDebug $GRADLE_ARGS
          elif [ "$BUILD_VARIANT" = "All" ]; then
            ./gradlew :TMessagesProj_AppStandalone:assembleAfatStandalone :TMessagesProj_App:assembleAfatRelease $GRADLE_ARGS
          fi

      - name: Dump CMake and Ninja logs on failure
        if: failure()
        run: |
          echo "=== CMake and Ninja Logs ==="
          find TMessagesProj/.cxx -type f \( -name "*.log" -o -name "*.txt" \) -exec echo "--- {} ---" \; -exec tail -n 100 {} \; || true

      - name: Collect APKs
        run: |
          mkdir -p output_apks
          find . -name "*.apk" -exec cp {} output_apks/ \;
          echo "Generated APKs:"
          ls -lh output_apks/

      - name: Upload APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: QorvhexGram-APKs
          path: output_apks/*.apk
          retention-days: 14

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: output_apks/*.apk
          draft: false
          prerelease: false
          generate_release_notes: true
